<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA Masterplan ETAP 07</title><link rel="stylesheet" href="/src/styles.css"><style>body{margin:0;background:#f6f3eb;padding:30px;font-family:Arial,sans-serif}.qa{max-width:1320px;margin:auto}.qa h1{font:500 30px Georgia;margin:0 0 16px;color:#14382d}.masterplan-wrap{height:auto}.masterplan-stage{width:100%}</style></head><body><div class="qa"><h1>QA — masterplan status / etykiety / kadrowanie</h1><div class="masterplan-wrap"><div class="masterplan-stage"><img class="masterplan-base" src="/assets/masterplan-map.jpg"><svg id="svg" class="masterplan-svg" viewBox="0 0 2013 1019" preserveAspectRatio="xMidYMid meet"></svg><div class="masterplan-compass"><span>N</span><svg viewBox="0 0 42 58"><path d="M21 2 8 48l13-7 13 7L21 2Z" fill="rgba(255,255,255,.94)" stroke="rgba(13,52,39,.74)"/><path d="M21 7v34" stroke="#d0a851" stroke-width="1.2"/></svg></div><div class="masterplan-legend"><span><i class="legend-dot legend-dot--available"></i>Dostępna</span><span><i class="legend-dot legend-dot--stage2"></i>Etap II</span><span><i class="legend-dot legend-dot--common"></i>Teren wspólny</span></div></div></div></div><script type="module">
import {PLOTS,DEFAULT_PLOT_ID} from '/src/plotData.js';
const statusClass=p=>p.status==='available'?'available':p.status==='reserved'?'reserved':p.status==='sold'?'sold':p.status==='stage2'?'stage2':'common';
const palettes={available:{base:'rgba(62,124,82,.065)',hover:'rgba(62,124,82,.20)',selected:'rgba(51,116,75,.31)',strokeBase:'rgba(48,111,71,.18)',strokeHover:'rgba(42,108,68,.72)',strokeSelected:'rgba(32,96,59,.92)'},reserved:{base:'rgba(193,153,69,.07)',hover:'rgba(193,153,69,.21)',selected:'rgba(184,139,55,.31)',strokeBase:'rgba(172,126,46,.18)',strokeHover:'rgba(168,119,36,.72)',strokeSelected:'rgba(151,102,27,.92)'},sold:{base:'rgba(169,78,67,.07)',hover:'rgba(169,78,67,.20)',selected:'rgba(157,64,54,.30)',strokeBase:'rgba(149,60,52,.18)',strokeHover:'rgba(147,55,47,.72)',strokeSelected:'rgba(126,43,37,.92)'},stage2:{base:'rgba(184,150,83,.055)',hover:'rgba(184,150,83,.18)',selected:'rgba(175,137,67,.28)',strokeBase:'rgba(164,126,55,.16)',strokeHover:'rgba(159,118,46,.66)',strokeSelected:'rgba(145,104,37,.88)'},common:{base:'rgba(112,119,105,.01)',hover:'rgba(112,119,105,.01)',selected:'rgba(112,119,105,.01)',strokeBase:'rgba(112,119,105,0)',strokeHover:'rgba(112,119,105,0)',strokeSelected:'rgba(112,119,105,0)'}};
const svg=document.querySelector('#svg'); let selected=DEFAULT_PLOT_ID; let hovered=null;
function draw(){svg.innerHTML=PLOTS.map(p=>{const i=p.sellable,s=p.id===selected,h=p.id===hovered, pal=palettes[statusClass(p)], fill=s?pal.selected:h?pal.hover:pal.base, stroke=s?pal.strokeSelected:h?pal.strokeHover:pal.strokeBase, sw=s?1.65:h?1.35:.55, vertical=p.rawId>=29&&p.rawId<=44; return `<g data-id="${p.id}" class="masterplot masterplot--${statusClass(p)} ${s?'is-selected':''} ${h?'is-hovered':''}"><path d="${p.d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" vector-effect="non-scaling-stroke" style="pointer-events:${i?'all':'none'}"/>${p.klasa!=='DROGOWA'?`<text x="${p.cx}" y="${p.cy}" ${vertical?`transform="rotate(90 ${p.cx} ${p.cy})"`:''} text-anchor="middle" dominant-baseline="middle" class="masterplot-label ${vertical?'masterplot-label--vertical':''}">${p.id}</text>`:''}</g>`}).join(''); svg.querySelectorAll('g[data-id]').forEach(g=>{const p=PLOTS.find(x=>x.id===g.dataset.id); if(!p?.sellable)return; g.onmouseenter=()=>{hovered=p.id;draw()}; g.onmouseleave=()=>{hovered=null;draw()}; g.onclick=()=>{selected=p.id;draw()};});} draw();
</script></body></html>
